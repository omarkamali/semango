# Semango Release Workflow
# Author: Omar Kamali <semango@omarkama.li>
# Triggered on version tags (v*)

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "20"
  FAISS_REPO: https://github.com/blevesearch/faiss.git
  FAISS_REF: b3d4e00a69425b95e0b283da7801efc9f66b580d
  ONNX_VERSION: "1.22.0"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          go-version: ${{ env.GO_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          faiss-ref: ${{ env.FAISS_REF }}
          onnx-version: ${{ env.ONNX_VERSION }}
          os: ubuntu-latest

      - name: Install UI dependencies and build
        working-directory: ui
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Copy UI to embed location
        run: |
          rm -rf internal/api/ui
          cp -r ui/dist internal/api/ui

      - name: Setup Libraries for GoReleaser
        run: |
          sudo cp libs-static/*.a /usr/local/lib/
          sudo cp libs/*.so* /usr/local/lib/
          sudo cp -r include/* /usr/local/include/
          sudo ldconfig

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"   # vX.Y.Z
          VERSION="${TAG#v}"

          cat > release-notes.md <<EOF
          ## Semango ${TAG}

          ### Install

          **macOS / Linux**
          \`\`\`bash
          curl -L "https://github.com/omarkamali/semango/releases/latest/download/semango_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m).tar.gz" | tar xz
          sudo mv semango /usr/local/bin/
          \`\`\`

          **Docker**
          \`\`\`bash
          docker pull ghcr.io/omarkamali/semango:${TAG}
          \`\`\`

          ### Changelog
          EOF

          # Extract the section for this version from CHANGELOG.md.
          # Matches headings like: "## [0.1.0] - 2024-12-13".
          awk -v v="${VERSION}" '
            BEGIN { in_section=0 }
            $0 ~ "^## \\[" v "\\]" { in_section=1; next }
            in_section && $0 ~ "^## \\[" { exit }
            in_section { print }
          ' CHANGELOG.md >> release-notes.md

          if ! grep -q "[A-Za-z0-9]" release-notes.md; then
            echo "Failed to generate release-notes.md" >&2
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build Docker image separately for better control
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/omarkamali/semango
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.release
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
