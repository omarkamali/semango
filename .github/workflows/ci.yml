# Semango CI Workflow
# Author: Omar Kamali <semango@omarkama.li>

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "20"
  FAISS_REPO: https://github.com/blevesearch/faiss.git
  FAISS_REF: b3d4e00a69425b95e0b283da7801efc9f66b580d
  ONNX_VERSION: "1.22.0"

jobs:
  lint-ui:
    name: Lint UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: ui/yarn.lock

      - name: Install UI dependencies
        working-directory: ui
        run: yarn install --frozen-lockfile

      - name: Lint UI
        working-directory: ui
        run: yarn lint

  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: ui/yarn.lock

      - name: Install UI dependencies
        working-directory: ui
        run: yarn install --frozen-lockfile

      - name: Build UI
        working-directory: ui
        run: yarn build

      - name: Upload UI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  test-and-build:
    name: ${{ matrix.os }} - Test & Build
    runs-on: ${{ matrix.os }}
    needs: build-ui
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libopenblas-dev libgflags-dev swig tesseract-ocr libleptonica-dev
          CUE_VERSION="0.9.2"
          curl -fsSL "https://github.com/cue-lang/cue/releases/download/v${CUE_VERSION}/cue_v${CUE_VERSION}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin cue

      - name: Install System Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install cmake openblas swig tesseract leptonica cue libomp

      - name: Install System Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          choco install swig cmake -y
          CUE_VERSION="0.9.2"
          curl -LO "https://github.com/cue-lang/cue/releases/download/v${CUE_VERSION}/cue_v${CUE_VERSION}_windows_amd64.zip"
          unzip -o cue_v${CUE_VERSION}_windows_amd64.zip
          mkdir -p bin
          mv cue.exe bin/
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Cache FAISS
        id: cache-faiss
        if: matrix.os != 'windows-latest'
        uses: actions/cache@v4
        with:
          path: |
            libs-static
            include/faiss
          key: ${{ matrix.os }}-faiss-${{ env.FAISS_REF }}-v6

      - name: Build FAISS Static (Linux/macOS)
        if: steps.cache-faiss.outputs.cache-hit != 'true' && matrix.os != 'windows-latest'
        run: scripts/build_faiss_static.sh

      - name: Install ONNX Runtime (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p libs include/onnxruntime
          curl -L -o onnx.tgz https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ONNX_VERSION }}/onnxruntime-linux-x64-${{ env.ONNX_VERSION }}.tgz
          tar -xzf onnx.tgz
          cp onnxruntime-linux-x64-${{ env.ONNX_VERSION }}/lib/libonnxruntime.so* libs/
          cp -r onnxruntime-linux-x64-${{ env.ONNX_VERSION }}/include/* include/onnxruntime/
          cd libs && ln -sf libonnxruntime.so.${{ env.ONNX_VERSION }} libonnxruntime.so && cd ..

      - name: Install ONNX Runtime (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p libs include/onnxruntime
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then
            ONNX_PKG="onnxruntime-osx-arm64-${{ env.ONNX_VERSION }}.tgz"
          else
            ONNX_PKG="onnxruntime-osx-x64-${{ env.ONNX_VERSION }}.tgz"
          fi
          curl -L -o onnx.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ONNX_VERSION }}/$ONNX_PKG"
          tar -xzf onnx.tgz
          ORT_DIR="${ONNX_PKG%.tgz}"
          cp "$ORT_DIR"/lib/libonnxruntime*.dylib libs/
          cp -r "$ORT_DIR"/include/* include/onnxruntime/
          # Ensure generic symlink for the linker
          cd libs && ln -sf $(ls libonnxruntime.*.dylib | head -n 1) libonnxruntime.dylib && cd ..

      - name: Install ONNX Runtime (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p libs include/onnxruntime
          curl -L -o onnx.zip https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ONNX_VERSION }}/onnxruntime-win-x64-${{ env.ONNX_VERSION }}.zip
          unzip -o onnx.zip
          cp onnxruntime-win-x64-${{ env.ONNX_VERSION }}/lib/onnxruntime.dll libs/
          cp onnxruntime-win-x64-${{ env.ONNX_VERSION }}/lib/onnxruntime.lib libs/
          cp -r onnxruntime-win-x64-${{ env.ONNX_VERSION }}/include/* include/onnxruntime/

      - name: Prepare Embedded ONNX Runtime (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: make onnx-embed

      - name: Prepare Embedded ONNX Runtime (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p internal/onnxruntime/embedded
          cp -f libs/onnxruntime.dll internal/onnxruntime/embedded/onnxruntime.dll

      - name: Download UI artifacts
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: internal/api/ui

      - name: Go Lint (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=10m --out-format=colored-line-number
        env:
          CGO_ENABLED: 1
          CGO_CPPFLAGS: "-I${{ github.workspace }}/include -I${{ github.workspace }}"
          CGO_LDFLAGS: "-L${{ github.workspace }}/libs-static -Wl,-Bstatic -l:libfaiss_c.a -l:libfaiss.a -Wl,-Bdynamic -lstdc++ -lgomp -lopenblas -lpthread -lm"

      - name: Run Tests
        if: matrix.os != 'windows-latest'
        run: make test

      - name: Build Binary (Posix)
        if: matrix.os != 'windows-latest'
        run: make build-no-ui

      - name: Build Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-L$(pwd)/libs -lonnxruntime"
          export CGO_CPPFLAGS="-I$(pwd)/include -I$(pwd)"
          go build -ldflags "-s -w" -o semango.exe ./cmd/semango

      - name: Verify Binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          ./semango --help

      - name: Verify Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          ./semango.exe --help

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: semango-${{ matrix.os }}
          path: |
            semango
            semango.exe
