# Semango CI Workflow
# Author: Omar Kamali <semango@omarkama.li>

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "20"
  FAISS_REPO: https://github.com/blevesearch/faiss.git
  FAISS_REF: b3d4e00a69425b95e0b283da7801efc9f66b580d
  ONNX_VERSION: "1.22.0"

jobs:
  lint-ui:
    name: Lint UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: ui/yarn.lock

      - name: Install UI dependencies
        working-directory: ui
        run: yarn install --frozen-lockfile

      - name: Lint UI
        working-directory: ui
        run: yarn lint

  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: ui/yarn.lock

      - name: Install UI dependencies
        working-directory: ui
        run: yarn install --frozen-lockfile

      - name: Build UI
        working-directory: ui
        run: yarn build

      - name: Upload UI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  test-and-build:
    name: ${{ matrix.os }} - Test & Build
    runs-on: ${{ matrix.os }}
    needs: build-ui
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          go-version: ${{ env.GO_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          faiss-ref: ${{ env.FAISS_REF }}
          onnx-version: ${{ env.ONNX_VERSION }}
          os: ${{ matrix.os }}

      - name: Download UI artifacts
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: internal/api/ui

      - name: Go Lint (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: ./... --timeout=10m --out-format=colored-line-number
        env:
          CGO_ENABLED: 1
          CGO_CPPFLAGS: "-I${{ github.workspace }}/include -I${{ github.workspace }}"
          CGO_LDFLAGS: "-L${{ github.workspace }}/libs-static -Wl,-Bstatic -l:libfaiss_c.a -l:libfaiss.a -Wl,-Bdynamic -lstdc++ -lgomp -lopenblas -lpthread -lm"

      - name: Run Tests
        if: matrix.os != 'windows-latest'
        run: make test

      - name: Build Binary (Posix)
        if: matrix.os != 'windows-latest'
        run: make build-no-ui

      - name: Build Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-L$(pwd)/libs -lonnxruntime"
          export CGO_CPPFLAGS="-I$(pwd)/include -I$(pwd)"
          go build -ldflags "-s -w" -o semango.exe ./cmd/semango

      - name: Verify Binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          ./semango --help

      - name: Verify Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          ./semango.exe --help

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: semango-${{ matrix.os }}
          path: |
            semango
            semango.exe
