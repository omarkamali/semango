# Semango CI Workflow
# Author: Omar Kamali <semango@omarkama.li>

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "20"
  FAISS_REPO: https://github.com/blevesearch/faiss.git
  FAISS_REF: b3d4e00a69425b95e0b283da7801efc9f66b580d
  ONNX_VERSION: "1.22.0"

jobs:
  lint-ui:
    name: Lint UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: ui/yarn.lock

      - name: Install UI dependencies
        working-directory: ui
        run: yarn install --frozen-lockfile

      - name: Lint UI
        working-directory: ui
        run: yarn lint

  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: ui/yarn.lock

      - name: Install UI dependencies
        working-directory: ui
        run: yarn install --frozen-lockfile

      - name: Build UI
        working-directory: ui
        run: yarn build

      - name: Upload UI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  test-and-build:
    name: ${{ matrix.os }} - Test & Build
    runs-on: ${{ matrix.os }}
    needs: build-ui
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libopenblas-dev libgflags-dev swig tesseract-ocr libleptonica-dev
          CUE_VERSION="0.9.2"
          curl -fsSL "https://github.com/cue-lang/cue/releases/download/v${CUE_VERSION}/cue_v${CUE_VERSION}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin cue

      - name: Install System Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install cmake openblas swig tesseract leptonica cue libomp

      - name: Install System Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          choco install swig cmake -y
          CUE_VERSION="0.9.2"
          curl -LO "https://github.com/cue-lang/cue/releases/download/v${CUE_VERSION}/cue_v${CUE_VERSION}_windows_amd64.zip"
          unzip -o cue_v${CUE_VERSION}_windows_amd64.zip
          mkdir -p bin
          mv cue.exe bin/
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Cache FAISS
        id: cache-faiss
        if: matrix.os != 'windows-latest'
        uses: actions/cache@v4
        with:
          path: |
            libs
            include/faiss
          key: ${{ matrix.os }}-faiss-${{ env.FAISS_REF }}-v5

      - name: Build FAISS C API (Linux/macOS)
        if: steps.cache-faiss.outputs.cache-hit != 'true' && matrix.os != 'windows-latest'
        run: |
          mkdir -p libs include/faiss
          git clone --branch bleve --single-branch "$FAISS_REPO" faiss
          cd faiss && git checkout "$FAISS_REF"
          # Set include path to repo root so <faiss/Header.h> works
          export CXXFLAGS="-I$PWD"
          CMAKE_OPTS="-DFAISS_ENABLE_GPU=OFF -DFAISS_ENABLE_C_API=ON -DBUILD_SHARED_LIBS=ON -DFAISS_ENABLE_PYTHON=OFF -DBUILD_TESTING=OFF -DFAISS_OPT_LEVEL=generic"
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            CMAKE_OPTS="$CMAKE_OPTS -DOpenMP_ROOT=$(brew --prefix libomp)"
          fi
          cmake -B build $CMAKE_OPTS -DCMAKE_CXX_FLAGS="-I$PWD" .
          make -C build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu) faiss faiss_c
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            find build -name "libfaiss_c.so*" -exec cp -d {} ../libs/ \;
            find build -name "libfaiss.so*" -exec cp -d {} ../libs/ \;
          else
            find build -name "libfaiss_c*.dylib" -exec cp {} ../libs/ \;
            find build -name "libfaiss*.dylib" -exec cp {} ../libs/ \;
            # On macOS, ensure generic names exist for the linker
            cd ../libs
            [ -f libfaiss_c.dylib ] || ln -s libfaiss_c.*.dylib libfaiss_c.dylib 2>/dev/null || true
            [ -f libfaiss.dylib ] || ln -s libfaiss.*.dylib libfaiss.dylib 2>/dev/null || true
            cd ..
          fi
          # Copy headers for CGO
          mkdir -p ../include/faiss
          cp -r c_api ../include/faiss/
          cd ..

      - name: Build FAISS C API (Windows)
        if: steps.cache-faiss.outputs.cache-hit != 'true' && matrix.os == 'windows-latest' && false # Skip FAISS on Windows
        shell: bash
        run: |
          mkdir -p libs include/faiss
          git clone --branch bleve --single-branch "$FAISS_REPO" faiss
          cd faiss && git checkout "$FAISS_REF"
          cmake -B build -G "MinGW Makefiles" \
            -DCMAKE_CXX_FLAGS="-I$(pwd)" \
            -DFAISS_ENABLE_GPU=OFF \
            -DFAISS_ENABLE_C_API=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DFAISS_ENABLE_PYTHON=OFF \
            -DBUILD_TESTING=OFF \
            -DFAISS_OPT_LEVEL=generic \
            -DBLA_VENDOR=OpenBLAS .
          mingw32-make -C build -j$NUMBER_OF_PROCESSORS faiss_c
          cp build/c_api/libfaiss_c.dll ../libs/
          cp -r c_api ../include/faiss/
          cd ..

      - name: Install ONNX Runtime (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p libs include/onnxruntime
          curl -L -o onnx.tgz https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ONNX_VERSION }}/onnxruntime-linux-x64-${{ env.ONNX_VERSION }}.tgz
          tar -xzf onnx.tgz
          cp onnxruntime-linux-x64-${{ env.ONNX_VERSION }}/lib/libonnxruntime.so* libs/
          cp -r onnxruntime-linux-x64-${{ env.ONNX_VERSION }}/include/* include/onnxruntime/
          cd libs && ln -sf libonnxruntime.so.${{ env.ONNX_VERSION }} libonnxruntime.so && cd ..

      - name: Install ONNX Runtime (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p libs include/onnxruntime
          curl -L -o onnx.tgz https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ONNX_VERSION }}/onnxruntime-osx-arm64-${{ env.ONNX_VERSION }}.tgz
          tar -xzf onnx.tgz
          cp onnxruntime-osx-arm64-${{ env.ONNX_VERSION }}/lib/libonnxruntime*.dylib libs/
          cp -r onnxruntime-osx-arm64-${{ env.ONNX_VERSION }}/include/* include/onnxruntime/
          # Ensure generic symlink for the linker
          cd libs && ln -sf $(ls libonnxruntime.*.dylib | head -n 1) libonnxruntime.dylib && cd ..

      - name: Install ONNX Runtime (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p libs include/onnxruntime
          curl -L -o onnx.zip https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ONNX_VERSION }}/onnxruntime-win-x64-${{ env.ONNX_VERSION }}.zip
          unzip -o onnx.zip
          cp onnxruntime-win-x64-${{ env.ONNX_VERSION }}/lib/onnxruntime.dll libs/
          cp onnxruntime-win-x64-${{ env.ONNX_VERSION }}/lib/onnxruntime.lib libs/
          cp -r onnxruntime-win-x64-${{ env.ONNX_VERSION }}/include/* include/onnxruntime/

      - name: Download UI artifacts
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: internal/api/ui

      - name: Go Lint (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=10m --out-format=colored-line-number
        env:
          CGO_ENABLED: 1
          LD_LIBRARY_PATH: "${{ github.workspace }}/libs"
          CGO_LDFLAGS: "-L${{ github.workspace }}/libs -lfaiss_c -lfaiss -lonnxruntime"
          CGO_CPPFLAGS: "-I${{ github.workspace }}/include -I${{ github.workspace }}"

      - name: Run Tests
        if: matrix.os != 'windows-latest'
        run: make test
        env:
          CGO_ENABLED: 1
          LIBS_DIR: ${{ github.workspace }}/libs
          LD_LIBRARY_PATH: "${{ github.workspace }}/libs"
          DYLD_LIBRARY_PATH: "${{ github.workspace }}/libs"
          CGO_CPPFLAGS: "-I${{ github.workspace }}/include -I${{ github.workspace }}"
          CGO_LDFLAGS: "-L${{ github.workspace }}/libs -lfaiss_c -lfaiss -lonnxruntime"

      - name: Build Binary (Posix)
        if: matrix.os != 'windows-latest'
        run: make build-no-ui
        env:
          CGO_ENABLED: 1
          LIBS_DIR: ${{ github.workspace }}/libs
          CGO_CPPFLAGS: "-I${{ github.workspace }}/include -I${{ github.workspace }}"
          CGO_LDFLAGS: "-L${{ github.workspace }}/libs -lfaiss_c -lfaiss -lonnxruntime"

      - name: Build Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-L$(pwd)/libs -lonnxruntime"
          export CGO_CPPFLAGS="-I$(pwd)/include -I$(pwd)"
          go build -ldflags "-s -w" -o semango.exe ./cmd/semango

      - name: Verify Binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          export LD_LIBRARY_PATH="${{ github.workspace }}/libs"
          export DYLD_LIBRARY_PATH="${{ github.workspace }}/libs"
          ./semango --help

      - name: Verify Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          export PATH="$(pwd)/libs:$PATH"
          ./semango.exe --help

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: semango-${{ matrix.os }}
          path: |
            semango
            semango.exe
            libs/*
