name: 'Build UI'
description: 'Install UI deps and build the Vite UI'

inputs:
  node-version:
    description: 'Node.js version'
    required: true
  version:
    description: 'Build version'
    required: false
    default: 'dev'
  commit:
    description: 'Commit hash'
    required: false
    default: 'unknown'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'yarn'
        cache-dependency-path: ui/yarn.lock

    - name: Install UI dependencies
      shell: bash
      working-directory: ui
      run: yarn install --frozen-lockfile

    - name: Build UI
      shell: bash
      working-directory: ui
      run: VITE_APP_VERSION=${{ inputs.version }} VITE_APP_COMMIT=${{ inputs.commit }} yarn build
