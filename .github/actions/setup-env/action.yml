name: 'Setup Semango Build Environment'
description: 'Install system dependencies, FAISS, and ONNX Runtime'

inputs:
  go-version:
    description: 'Go version'
    required: true
    default: '1.23'
  node-version:
    description: 'Node version'
    required: true
    default: '20'
  faiss-ref:
    description: 'FAISS git reference'
    required: true
  onnx-version:
    description: 'ONNX Runtime version'
    required: true
    default: '1.22.0'
  os:
    description: 'Operating system (ubuntu-latest, macos-latest, windows-latest)'
    required: true
    default: 'ubuntu-latest'

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "yarn"
        cache-dependency-path: ui/yarn.lock

    - name: Install System Dependencies (Linux)
      if: inputs.os == 'ubuntu-latest'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake libopenblas-dev libgflags-dev swig tesseract-ocr libleptonica-dev
        CUE_VERSION="0.9.2"
        curl -fsSL "https://github.com/cue-lang/cue/releases/download/v${CUE_VERSION}/cue_v${CUE_VERSION}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin cue

    - name: Install System Dependencies (macOS)
      if: inputs.os == 'macos-latest'
      shell: bash
      run: brew install cmake openblas swig tesseract leptonica cue libomp

    - name: Install System Dependencies (Windows)
      if: inputs.os == 'windows-latest'
      shell: bash
      run: |
        choco install swig cmake -y
        CUE_VERSION="0.9.2"
        curl -LO "https://github.com/cue-lang/cue/releases/download/v${CUE_VERSION}/cue_v${CUE_VERSION}_windows_amd64.zip"
        unzip -o cue_v${CUE_VERSION}_windows_amd64.zip
        mkdir -p bin
        mv cue.exe bin/
        echo "$(pwd)/bin" >> $GITHUB_PATH

    - name: Cache FAISS
      id: cache-faiss
      if: inputs.os != 'windows-latest'
      uses: actions/cache@v4
      with:
        path: |
          libs-static
          include/faiss
        key: ${{ inputs.os }}-faiss-${{ inputs.faiss-ref }}-v6

    - name: Build FAISS Static (Linux/macOS)
      if: steps.cache-faiss.outputs.cache-hit != 'true' && inputs.os != 'windows-latest'
      shell: bash
      run: scripts/build_faiss_static.sh

    - name: Install ONNX Runtime (Linux)
      if: inputs.os == 'ubuntu-latest'
      shell: bash
      run: |
        mkdir -p libs include/onnxruntime
        curl -L -o onnx.tgz https://github.com/microsoft/onnxruntime/releases/download/v${{ inputs.onnx-version }}/onnxruntime-linux-x64-${{ inputs.onnx-version }}.tgz
        tar -xzf onnx.tgz
        cp onnxruntime-linux-x64-${{ inputs.onnx-version }}/lib/libonnxruntime.so* libs/
        cp -r onnxruntime-linux-x64-${{ inputs.onnx-version }}/include/* include/onnxruntime/
        cd libs && ln -sf libonnxruntime.so.${{ inputs.onnx-version }} libonnxruntime.so && cd ..

    - name: Install ONNX Runtime (macOS)
      if: inputs.os == 'macos-latest'
      shell: bash
      run: |
        mkdir -p libs include/onnxruntime
        ARCH="$(uname -m)"
        if [ "$ARCH" = "arm64" ]; then
          ONNX_PKG="onnxruntime-osx-arm64-${{ inputs.onnx-version }}.tgz"
        else
          ONNX_PKG="onnxruntime-osx-x64-${{ inputs.onnx-version }}.tgz"
        fi
        curl -L -o onnx.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${{ inputs.onnx-version }}/$ONNX_PKG"
        tar -xzf onnx.tgz
        ORT_DIR="${ONNX_PKG%.tgz}"
        cp "$ORT_DIR"/lib/libonnxruntime*.dylib libs/
        cp -r "$ORT_DIR"/include/* include/onnxruntime/
        cd libs && ln -sf $(ls libonnxruntime.*.dylib | head -n 1) libonnxruntime.dylib && cd ..

    - name: Install ONNX Runtime (Windows)
      if: inputs.os == 'windows-latest'
      shell: bash
      run: |
        mkdir -p libs include/onnxruntime
        curl -L -o onnx.zip https://github.com/microsoft/onnxruntime/releases/download/v${{ inputs.onnx-version }}/onnxruntime-win-x64-${{ inputs.onnx-version }}.zip
        unzip -o onnx.zip
        cp onnxruntime-win-x64-${{ inputs.onnx-version }}/lib/onnxruntime.dll libs/
        cp onnxruntime-win-x64-${{ inputs.onnx-version }}/lib/onnxruntime.lib libs/
        cp -r onnxruntime-win-x64-${{ inputs.onnx-version }}/include/* include/onnxruntime/

    - name: Prepare Embedded ONNX Runtime (Linux/macOS)
      if: inputs.os != 'windows-latest'
      shell: bash
      run: make onnx-embed

    - name: Prepare Embedded ONNX Runtime (Windows)
      if: inputs.os == 'windows-latest'
      shell: bash
      run: |
        mkdir -p internal/onnxruntime/embedded
        cp -f libs/onnxruntime.dll internal/onnxruntime/embedded/onnxruntime.dll
