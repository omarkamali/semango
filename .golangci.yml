# Semango golangci-lint configuration
# Author: Omar Kamali <semango@omarkama.li>

run:
  timeout: 5m
  modules-download-mode: readonly

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - errcheck
        - bodyclose
    # Exclude vendor and generated files
    - path: vendor/
      linters:
        - all
    - path: internal/api/ui/
      linters:
        - all
    # Allow TODO comments
    - source: "TODO"
      linters:
        - godox

  max-issues-per-linter: 50
  max-same-issues: 10
